[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind"
version = "0.1.0"
description = "A learning-focused retrieval-augmented generation backend."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]
